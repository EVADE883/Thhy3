<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thhy3 | Accs</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: url('backround.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(15px);
            transform: scale(1.1); 
        }

        .card { 
            background: rgba(10, 10, 10, 0.85); 
            padding: 40px; 
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center; 
            width: 500px; 
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            color: #fff;
            backdrop-filter: blur(10px);
        }
        
        .pfp { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            border: 3px solid #fe2c55; 
            object-fit: cover; 
            margin-bottom: 20px; 
        }

        h2 { margin: 0 0 25px 0; font-size: 2rem; }

        .btn { 
            display: block; 
            padding: 18px 0; 
            margin: 12px 0; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: bold; 
            color: #fff; 
            font-size: 1.1rem;
            transition: 0.3s ease; 
        }

        .tiktok { background: #fe2c55; }
        .discord { background: #5865F2; }
        .mc-btn { background: #388E3C; } 

        .feedback-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .f-btn {
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 1rem;
            opacity: 0.4; /* Dimmed when locked or inactive */
        }

        .f-btn.active { opacity: 1; transform: scale(1.1); }
        /* Style for when a button is "clickable" but not currently active */
        .f-btn.available { opacity: 0.8; }

        .like-btn { background: #2e7d32; }
        .dislike-btn { background: #c62828; }

        .f-btn:not(.disabled):hover { filter: brightness(1.2); }
        .disabled { cursor: not-allowed; }

        .count { display: block; font-size: 0.9rem; margin-top: 8px; font-weight: bold; }
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="card">
        <img src="pfp.jpg" alt="Profile Image" class="pfp">
        <h2>Thhy3</h2>
        
        <a href="https://www.tiktok.com/@baget475" target="_blank" class="btn tiktok">TikTok</a>
        <a href="https://discord.com/users/1451506656713113731" target="_blank" class="btn discord">Discord</a>
        <a href="https://laby.net/@Thhy3" target="_blank" class="btn mc-btn">Mc Acount</a>

        <div class="feedback-container">
            <div>
                <button id="like-btn" class="f-btn like-btn" onclick="toggleVote('likes')">👍 Like</button>
                <span id="like-count" class="count">0</span>
            </div>
            <div>
                <button id="dislike-btn" class="f-btn dislike-btn" onclick="toggleVote('dislikes')">👎 Dislike</button>
                <span id="dislike-count" class="count">0</span>
            </div>
        </div>
    </div>

    <script>
        function toggleVote(type) {
            const otherType = (type === 'likes') ? 'dislikes' : 'likes';
            
            const isSelfVoted = localStorage.getItem('user_voted_' + type) === 'true';
            const isOtherVoted = localStorage.getItem('user_voted_' + otherType) === 'true';

            // If the other button is already active, prevent voting on this one
            if (isOtherVoted) {
                alert(`You must remove your ${otherType.slice(0, -1)} first!`);
                return;
            }

            let currentCount = parseInt(localStorage.getItem('total_' + type)) || 0;

            if (isSelfVoted) {
                // Remove vote (Toggle off)
                currentCount = Math.max(0, currentCount - 1);
                localStorage.setItem('user_voted_' + type, 'false');
            } else {
                // Add vote (Toggle on)
                currentCount++;
                localStorage.setItem('user_voted_' + type, 'true');
            }

            localStorage.setItem('total_' + type, currentCount);
            renderCounts();
        }

        function renderCounts() {
            const likes = localStorage.getItem('total_likes') || 0;
            const dislikes = localStorage.getItem('total_dislikes') || 0;
            document.getElementById('like-count').innerText = likes;
            document.getElementById('dislike-count').innerText = dislikes;

            const liked = localStorage.getItem('user_voted_likes') === 'true';
            const disliked = localStorage.getItem('user_voted_dislikes') === 'true';
            
            const lBtn = document.getElementById('like-btn');
            const dBtn = document.getElementById('dislike-btn');

            // Handle Like Button States
            lBtn.classList.toggle('active', liked);
            lBtn.classList.toggle('disabled', disliked);
            lBtn.classList.toggle('available', !liked && !disliked);

            // Handle Dislike Button States
            dBtn.classList.toggle('active', disliked);
            dBtn.classList.toggle('disabled', liked);
            dBtn.classList.toggle('available', !liked && !disliked);
        }

        renderCounts();
    </script>
</body>
</html>
